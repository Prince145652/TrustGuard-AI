[package]
name = "trustguard-registry"
version = "0.1.0"
authors = ["TrustGuard AI Team <security@trustguard.ai>"]
edition = "2021"
description = "NEAR Protocol Smart Contract for Immutable Web3 Security Report Anchoring"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.7.0", features = ["legacy", "unit-testing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
